<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A minimal local-first writing page with no account and no visible controls."
    >
    <title>Jot</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <div
        class="editor"
        id="editor"
        contenteditable="true"
        spellcheck="true"
        aria-label="Local note"
      ></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
